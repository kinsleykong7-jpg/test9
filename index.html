<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kinsley's Personal Space</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #000;
    color: #fff;
    font-family: 'Playfair Display', serif;
    overflow: hidden;
    height: 100vh;
    height: 100dvh;
  }

  /* ===== 电影开场 ===== */
  #cinema {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    transition: opacity 1.8s ease;
  }

  #cinema.fade-out {
    opacity: 0;
    pointer-events: none;
  }

  .title-card {
    opacity: 0;
    transform: translateY(12px);
    transition: all 1.6s ease;
  }

  .title-card.show {
    opacity: 1;
    transform: translateY(0);
  }

  .film-by {
    font-size: 14px;
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-bottom: 28px;
    opacity: 0.85;
  }

  .film-title {
    font-size: clamp(28px, 8vw, 48px);
    font-weight: 400;
    letter-spacing: 2px;
    margin-bottom: 40px;
  }

  .palme {
    margin-top: 50px;
    opacity: 0;
    transition: opacity 2s ease 0.6s;
  }

  .palme.show {
    opacity: 1;
  }

  .palme-line {
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin: 6px 0;
    opacity: 0.75;
  }

  .palme-main {
    font-size: 18px;
    letter-spacing: 3px;
    margin: 14px 0;
    font-style: italic;
  }

  .skip {
    position: absolute;
    bottom: 40px;
    left: 0;
    right: 0;
    font-size: 11px;
    letter-spacing: 3px;
    opacity: 0.4;
    cursor: pointer;
    transition: opacity 0.4s;
  }

  .skip:hover {
    opacity: 0.8;
  }

  /* ===== 主内容 ===== */
  #main {
    opacity: 0;
    transition: opacity 2s ease;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    text-align: center;
  }

  #main.show {
    opacity: 1;
  }

  .space-title {
    font-size: 13px;
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-bottom: 60px;
    opacity: 0.7;
  }

  .name {
    font-size: clamp(32px, 9vw, 52px);
    font-weight: 400;
    margin-bottom: 50px;
    letter-spacing: 1px;
  }

  .countdown-block {
    margin-bottom: 36px;
  }

  .countdown-label {
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.55;
    margin-bottom: 8px;
  }

  .countdown-time {
    font-family: 'Courier Prime', monospace;
    font-size: clamp(26px, 7vw, 42px);
    letter-spacing: 2px;
  }

  .countdown-time.small {
    font-size: clamp(18px, 5vw, 28px);
    opacity: 0.85;
  }

  /* 底部音乐条 */
  .player {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #111;
    border-top: 1px solid #222;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: 'Courier Prime', monospace;
    font-size: 12px;
  }

  .player-art {
    width: 36px;
    height: 36px;
    background: #222;
    flex-shrink: 0;
  }

  .player-info {
    flex: 1;
    overflow: hidden;
  }

  .player-title {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .player-artist {
    opacity: 0.5;
    margin-top: 2px;
  }

  .player-controls {
    display: flex;
    gap: 18px;
    font-size: 14px;
    opacity: 0.8;
  }

  audio {
    display: none;
  }
</style>
</head>
<body>

  <!-- 电影开场 -->
  <div id="cinema">
    <div class="title-card" id="card1">
      <div class="film-by">A film by</div>
      <div class="film-title">kinsleykong</div>
    </div>

    <div class="palme" id="palme">
      <div class="palme-line">Festival de Cannes</div>
      <div class="palme-main">Palme d'Or</div>
      <div class="palme-line">Best Film</div>
    </div>

    <div class="skip" id="skip">click to skip</div>
  </div>

  <!-- 主页面 -->
  <div id="main">
    <div class="space-title">KINSLEY'S PERSONAL SPACE</div>
    <div class="name">kinsleykong</div>

    <div class="countdown-block">
      <div class="countdown-label">Hours Lived</div>
      <div class="countdown-time" id="hours">0:00:00</div>
    </div>

    <div class="countdown-block">
      <div class="countdown-label">Next Birthday</div>
      <div class="countdown-time small" id="birthday">0:00:00</div>
    </div>
  </div>

  <!-- 音乐播放器 -->
  <div class="player">
    <div class="player-art"></div>
    <div class="player-info">
      <div class="player-title">Clair de Lune</div>
      <div class="player-artist">Debussy</div>
    </div>
    <div class="player-controls">
      <span onclick="document.getElementById('audio').currentTime -= 10">‹‹</span>
      <span onclick="togglePlay()" id="playBtn">▶</span>
      <span onclick="document.getElementById('audio').currentTime += 10">››</span>
    </div>
  </div>

  <audio id="audio" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

<script>
  // 倒计时
  const birth = new Date(2002, 11, 22);
  const pad = n => String(n).padStart(2, '0');
  const fmt = s => Math.floor(s / 3600) + ':' + pad(Math.floor(s % 3600 / 60)) + ':' + pad(s % 60);

  function updateTime() {
    const now = new Date();
    document.getElementById('hours').textContent = fmt(Math.floor((now - birth) / 1000));

    let next = new Date(now.getFullYear(), 11, 22);
    if (next <= now) next = new Date(now.getFullYear() + 1, 11, 22);
    document.getElementById('birthday').textContent = fmt(Math.floor((next - now) / 1000));
  }
  updateTime();
  setInterval(updateTime, 1000);

  // 电影开场动画
  const cinema = document.getElementById('cinema');
  const card1 = document.getElementById('card1');
  const palme = document.getElementById('palme');
  const main = document.getElementById('main');
  const skipBtn = document.getElementById('skip');

  let skipped = false;

  function startFilm() {
    setTimeout(() => card1.classList.add('show'), 800);
    setTimeout(() => palme.classList.add('show'), 2600);
    setTimeout(() => {
      if (!skipped) endIntro();
    }, 7000);
  }

  function endIntro() {
    skipped = true;
    cinema.classList.add('fade-out');
    setTimeout(() => {
      cinema.style.display = 'none';
      main.classList.add('show');
    }, 1800);
  }

  skipBtn.addEventListener('click', endIntro);
  cinema.addEventListener('click', (e) => {
    if (e.target === skipBtn) return;
    endIntro();
  });

  // 音乐
  function togglePlay() {
    const audio = document.getElementById('audio');
    const btn = document.getElementById('playBtn');
    if (audio.paused) {
      audio.play();
      btn.textContent = '❚❚';
    } else {
      audio.pause();
      btn.textContent = '▶';
    }
  }

  // 启动
  startFilm();
</script>
</body>
</html>
